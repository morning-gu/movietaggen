# 默认配置：real 数据、全量、全模态全维度（字段与 movietaggen/config.py 的 schema 一一对应）
exp_name: ablation/llm-mapper
mock: false

data:
  source: real
  universe: three_modality    # 440 协议评测宇宙：three_modality | all
  movie_limit: null           # null = 全量
  seed: 42
  raw_dir: "../genometag-mllm/data/raw"   # 仅 source: real 生效，相对仓库根解析

model:
  base_url_env: OPENAI_BASE_URL
  api_key_env: OPENAI_API_KEY
  model: qwen3.7-plus
  temperature: 0.7
  max_frames: 12
  script_token_budget: 4000
  dialogue_token_budget: 3000
  request_interval: 0.5       # 两次请求间隔秒数（简单限速）
  extra_body: {}              # 端点专有参数透传（如 DashScope {enable_thinking: false}）

generate:
  n_runs: 3
  modalities: [video, script, dialogue]
  dimensions: [style, mood, theme, narrative, character]
  few_shot_examples: 0
  workers: 8                  # 并行线程数（1=串行）。主实验 8 并行——任务独立、
                              # 结果与串行逐位等价（有测试钉死），A 在同服务器同
                              # 账号 8 并行验证过 DashScope 限速

align:
  mapper: llm               # B② LLM 语义选择（嵌入召回 top-10）
  mapper_workers: 8         # 选择调用并行
  embed_model: intfloat/multilingual-e5-base
  embed_device: cpu
  top_k: 3
  threshold: 0.5
  agg: max                    # max | mean
  input_exp: null             # null = 用本配置的 generate 产物；字符串 = 复用其它实验
  calib_method: isotonic      # isotonic | linear

audit:
  input_exp: null
  judge_tasks: [mapping, gen_quality]
  judge_model: qwen3.7-plus
  judge_temperature: 0.0
  judge_context: pair+title   # pair | pair+title | pair+full
  sample_rate: 1.0
  apply_filter: true
  calibration_sample: 500
  seed: 42
  workers: 8                  # judge 并行线程数（1=串行）；全量 ~58k 审计 8 并行 ≈ 2-4h

eval:
  embed_model: intfloat/multilingual-e5-base
  coverage_top_k: 10
  coverage_tau: 0.85

baselines:
  run: [direct_score, genre_map, random, bert]
  n_runs: 3
  few_shot_examples: 2
  direct_score_source: a_borrow   # direct_score 基线读 A 迁移评分（真实数据工件，仅 real）

protocol:
  temporal_split_year: 2015   # 仅描述性分桶视图；拟合面已固定为 eval_test 清单训练侧
  relevance_threshold: 0.5
  top_k: 10
  cold_start_max_tags: 0
