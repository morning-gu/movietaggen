# 冒烟配置：mock 模式 + 合成数据，快速端到端跑通（其余字段用 schema 默认值）
exp_name: smoke
mock: true

data:
  source: synthetic

generate:
  n_runs: 2
  workers: 1

# baselines.run 钉为离线三元组（控制器裁定 4）：schema 默认含 bert，而 bert
# 需要 HF 模型下载——冒烟必须免下载，故显式排除（test_baselines.py 钉住）。
baselines:
  run: [direct_score, genre_map, random]
  # synthetic 无 A 迁移物（a_borrow 仅限 real），direct_score 自跑
  direct_score_source: own_run

# 合成电影年份 2018-2023：temporal_split_year 仅描述性分桶视图用
protocol:
  temporal_split_year: 2019
